# Cost-aware DPO configuration for a single Colab Pro A100 40 GB.
# The dataset has only 24 short preference pairs, so this configuration favors
# a short, reproducible run over long schedules or memory-saving techniques that
# reduce throughput.

seed: 42

secrets:
  huggingface_token_name: HF_TOKEN
  llm_api_key_name: XAH_API_KEY

llm:
  provider: openai_compatible
  base_url: https://api.xah.io/v1
  model: levuphong2909/gpt-5.6-luna
  route: /chat/completions

runtime:
  required_gpu_name_contains: A100
  minimum_vram_gb: 38
  max_wall_minutes: 30
  fail_if_wrong_gpu: true
  fail_if_cuda_unavailable: true

paths:
  train_data: data/sample_preferences.jsonl
  regression_prompts: docs/regression_prompts.md
  output_dir: outputs/colab-a100-dpo
  adapter_dir: outputs/colab-a100-dpo/final-adapter

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: false
  use_cache: false
  quantization: none

data:
  validation_ratio: 0.20
  max_length: 512
  truncation_mode: keep_start
  pad_to_multiple_of: 8
  dataset_num_proc: 2

training:
  method: dpo
  loss_type: sigmoid
  beta: 0.10
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  # Current TRL accepts a fractional value through warmup_steps.
  warmup_steps: 0.10
  num_train_epochs: 6
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optim: adamw_torch_fused
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  precompute_ref_log_probs: true
  precompute_ref_batch_size: 16
  auto_find_batch_size: false
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  logging_steps: 1
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  save_only_model: true
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: none
  torch_compile: false
  use_liger_kernel: false

lora:
  task_type: CAUSAL_LM
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: all-linear
  bias: none
  use_rslora: true

evaluation:
  run_before_training: true
  run_after_training: true
  pairwise_batch_size: 8
  tie_score: 0.0
  generation_max_new_tokens: 192
  do_sample: false
  regression_prompts: docs/regression_prompts.md
  save_examples: true

artifacts:
  save_merged_model: false
  save_optimizer_state: false
  save_adapter_only: true
  save_metrics_json: true
  copy_to_google_drive: true
